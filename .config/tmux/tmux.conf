################
# PLUGINS			 #
################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'

# set -g @plugin 'iaquobe/tmux-gruvbox'
# set -g @gruvbox 'dark'
# run-shell 'tmux set -g @gruvbox "$(dms ipc theme getMode)"'
set -g @plugin 'egel/tmux-gruvbox'
run-shell 'tmux set -g @tmux-gruvbox "$(dms ipc theme getMode)"'
# set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# pluggin configs
set -g @resurrect-strategy-nvim 'session'

# Load plugins
run '~/.tmux/plugins/tpm/tpm'

set  -g allow-passthrough on
set  -g base-index      1
setw -g pane-base-index 1
set  -g mouse             on
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     10000
set  -g status-keys vi
set  -g mode-keys   vi

# rebind main key: C-space
unbind C-b
set -g prefix C-space
bind -N "Send the prefix key through to the application" \
  C-space send-prefix

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -n M-Left swap-window -t -1\; select-window -t -1
bind -n M-Right swap-window -t +1\; select-window -t +1
bind -n M-j select-window -t -1
bind -n M-k select-window -t +1
set-option -g renumber-windows on


set -g update-environment "SSH_AUTH_SOCK"


# set -g default-terminal "tmux-256color"
# Kitty terminal capabilities
# set -as terminal-features ",xterm-kitty:RGB"
# # Italics support
# set -as terminal-overrides ",xterm-kitty:sitm=\E[3m:ritm=\E[23m"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
